<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Store</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;padding-bottom:80px}
        .header{background:linear-gradient(135deg,#1a3a1a,#0a1a0a);padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
        .header h1{font-size:20px;color:#fff}
        .badge{background:#4caf50;color:#fff;padding:2px 10px;border-radius:20px;font-size:11px}
        .tabs{display:flex;background:#1a1a1a;padding:4px;gap:4px;position:sticky;top:62px;z-index:10}
        .tabs button{flex:1;background:0 0;border:none;color:#888;padding:10px 4px;border-radius:8px;font-size:12px;cursor:pointer}
        .tabs button.active{background:#1565c0;color:#fff}
        .tab{display:none;padding:12px;max-width:600px;margin:0 auto}
        .tab.active{display:block}
        .card{background:#1a1a1a;border-radius:12px;padding:16px;margin-bottom:12px}
        .card.green{background:linear-gradient(135deg,#1a3a1a,#0d1f0d);border:1px solid #2a4a2a}
        .card h2{font-size:18px;color:#fff;margin-bottom:4px}
        .card p{color:#888;font-size:13px}
        .stats{display:flex;gap:12px;margin-top:12px}
        .stats div{flex:1;background:#0a1a0a;border-radius:8px;padding:8px;text-align:center}
        .stats span{display:block;font-size:20px;font-weight:700;color:#4caf50}
        .stats small{font-size:10px;color:#666}
        .row{display:flex;gap:8px;margin-top:12px}
        .row button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
        .btn-primary{background:#1565c0;color:#fff}
        .btn-secondary{background:0 0;color:#4caf50;border:1px solid #4caf50}
        .plugin{background:#1a1a1a;border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid #2196f3}
        .plugin .top{display:flex;align-items:center;gap:10px}
        .plugin .icon{font-size:24px}
        .plugin .info{flex:1}
        .plugin .name{font-weight:600;color:#fff;font-size:14px}
        .plugin .desc{font-size:11px;color:#aaa}
        .plugin .meta{font-size:10px;color:#666;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
        .plugin .actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
        .plugin .actions button{padding:4px 12px;border:none;border-radius:6px;font-size:11px;cursor:pointer}
        .btn-install{background:#4caf50;color:#fff}
        .btn-installed{background:0 0;color:#4caf50;border:1px solid #4caf50}
        .btn-details{background:0 0;color:#888}
        .btn-delete{background:0 0;color:#f44336}
        input,textarea{width:100%;padding:10px;background:#0d0d0d;border:1px solid #333;border-radius:8px;color:#fff;font-size:13px;margin-top:4px;font-family:inherit}
        input:focus,textarea:focus{border-color:#1565c0;outline:0}
        label{font-size:12px;color:#888}
        .file-drop{background:#0d0d0d;border:2px dashed #333;border-radius:8px;padding:16px;text-align:center;color:#666;cursor:pointer;margin-top:4px}
        .file-drop input{display:none}
        .empty{text-align:center;padding:32px;color:#666}
        .empty .icon{font-size:40px;display:block;margin-bottom:8px}
        .empty h4{color:#fff;margin-bottom:4px}
        .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:0.3s;pointer-events:none;z-index:100}
        .toast.show{opacity:1}
        @media(max-width:480px){.stats{flex-wrap:wrap}.stats div{min-width:80px}}
    </style>
</head>
<body>

<div class="header">
    <h1>🛒 Plugin Store</h1>
    <span class="badge">v3.0</span>
</div>

<div class="tabs" id="tabs">
    <button class="active" data-tab="home">🏠 Главная</button>
    <button data-tab="catalog">📚 Каталог</button>
    <button data-tab="installed">📦 Установленные</button>
    <button data-tab="upload">📤 Загрузить</button>
</div>

<div id="home" class="tab active">
    <div class="card green">
        <h2>🔥 Добро пожаловать!</h2>
        <p>Магазин плагинов для Dolphy</p>
        <div class="stats">
            <div><span id="total">0</span><small>Доступно</small></div>
            <div><span id="installed">0</span><small>Установлено</small></div>
            <div><span id="updates">0</span><small>Обновлений</small></div>
        </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px">
        <h3 style="font-size:15px;color:#fff">⭐ Популярные</h3>
        <button style="background:0;border:0;color:#4caf50;font-size:12px;cursor:pointer" onclick="switchTab('catalog')">Смотреть все →</button>
    </div>
    <div id="popular"></div>
    <div class="row">
        <button class="btn-primary" onclick="switchTab('catalog')">📚 Каталог</button>
        <button class="btn-secondary" onclick="switchTab('upload')">📤 Загрузить</button>
    </div>
</div>

<div id="catalog" class="tab">
    <div style="margin-bottom:12px">
        <input type="text" id="search" placeholder="🔍 Поиск..." oninput="filterPlugins()">
    </div>
    <div id="catalog-list"></div>
</div>

<div id="installed" class="tab">
    <div id="installed-list"></div>
</div>

<div id="upload" class="tab">
    <div class="card">
        <h3 style="font-size:17px;color:#fff">📤 Загрузка плагина</h3>
        <p style="color:#888;font-size:13px;margin-bottom:12px">Поделитесь с сообществом</p>
        <label>📝 Название</label><input type="text" id="up-name" placeholder="Название">
        <label style="display:block;margin-top:10px">📄 Описание</label><textarea id="up-desc" rows="2" placeholder="Краткое описание"></textarea>
        <label style="display:block;margin-top:10px">👤 Автор</label><input type="text" id="up-author" placeholder="Ваше имя">
        <label style="display:block;margin-top:10px">📌 Версия</label><input type="text" id="up-version" value="1.0.0">
        <label style="display:block;margin-top:10px">📂 Файл (.js)</label>
        <div class="file-drop" onclick="document.getElementById('file-input').click()">
            <span id="file-name">Выберите файл</span>
            <input type="file" id="file-input" accept=".js" onchange="selectFile()">
        </div>
        <button class="btn-primary" style="width:100%;margin-top:14px;padding:12px" onclick="uploadPlugin()">🚀 Опубликовать</button>
    </div>
</div>

<script>
const STORE={plugins:[],installed:[],currentTab:'home'};
const DEFAULT_PLUGINS=[
    {id:'dolphy.vpn',name:'DolphyVPN',desc:'HTTP/3 VPN tunnel with encryption',author:'DCA',ver:'2.5.0',icon:'🔒',color:'#00bcd4',downloads:1256,rating:42},
    {id:'dolphy.scanner',name:'Security Scanner',desc:'Plugin security scanner with detailed report',author:'gyrut',ver:'3.2.0',icon:'🛡️',color:'#2196f3',downloads:2345,rating:49},
    {id:'dolphy.news',name:'Dolphy News',desc:'News aggregator with RSS support',author:'DCA',ver:'2.3.0',icon:'📰',color:'#1565c0',downloads:867,rating:46},
    {id:'dolphy.browser',name:'Dolphy Browser',desc:'Browser with tabs and bookmarks',author:'DCA',ver:'2.0.0',icon:'🌐',color:'#4caf50',downloads:543,rating:45},
    {id:'dolphy.code',name:'Dolphy Code',desc:'Code editor with syntax highlighting',author:'DCA',ver:'2.1.0',icon:'💻',color:'#007acc',downloads:789,rating:47}
];

function loadData(){
    try{const d=localStorage.getItem('store_installed');if(d)STORE.installed=JSON.parse(d)}catch(e){}
    STORE.plugins=DEFAULT_PLUGINS;renderAll()
}
function renderAll(){renderStats();renderPopular();renderCatalog();renderInstalled()}
function renderStats(){
    document.getElementById('total').textContent=STORE.plugins.length;
    document.getElementById('installed').textContent=STORE.installed.length;
    const u=STORE.installed.filter(p=>{const a=STORE.plugins.find(x=>x.id===p.id);return a&&a.ver!==p.ver}).length;
    document.getElementById('updates').textContent=u
}
function renderPopular(){
    const el=document.getElementById('popular');
    const list=[...STORE.plugins].sort((a,b)=>(b.downloads||0)-(a.downloads||0)).slice(0,3);
    el.innerHTML=list.map(p=>cardHtml(p,true)).join('')
}
function renderCatalog(){
    document.getElementById('catalog-list').innerHTML=STORE.plugins.map(p=>cardHtml(p,false)).join('')
}
function renderInstalled(){
    const el=document.getElementById('installed-list');
    if(!STORE.installed.length){el.innerHTML='<div class="empty"><span class="icon">📦</span><h4>Нет плагинов</h4><p style="color:#666;font-size:13px">Установите что-нибудь из каталога</p></div>';return}
    el.innerHTML=STORE.installed.map(p=>installedCard(p)).join('')
}
function cardHtml(p,compact){
    const inst=STORE.installed.some(x=>x.id===p.id);
    const c=p.color||'#2196f3';
    return `<div class="plugin" style="border-left-color:${c}">
        <div class="top"><span class="icon">${p.icon||'🔌'}</span>
        <div class="info"><div class="name">${p.name}</div>
        <div class="desc">${compact?p.desc.substring(0,50)+'...':p.desc}</div>
        <div class="meta"><span>v${p.ver}</span><span>· ${p.author}</span><span>⭐${p.rating||0}</span><span>📥${p.downloads||0}</span></div></div></div>
        <div class="actions">${!compact?`<button class="btn-details" onclick="showDetails('${p.id}')">📖 Подробнее</button>`:''}
        ${inst?`<button class="btn-installed" disabled>✅ Установлен</button>`:`<button class="btn-install" onclick="installPlugin('${p.id}')">📥 Установить</button>`}</div>
    </div>`
}
function installedCard(p){
    const a=STORE.plugins.find(x=>x.id===p.id);
    const u=a&&a.ver!==p.ver;
    return `<div class="plugin" style="border-left-color:${u?'#ffa726':'#4caf50'}">
        <div class="top"><span class="icon">${p.icon||'🔌'}</span>
        <div class="info"><div class="name">${p.name}${u?' 🔄':''}</div>
        <div class="meta"><span>v${p.ver}</span><span>· ${p.author}</span>${u?`<span style="color:#ffa726">→ v${a.ver}</span>`:''}</div></div></div>
        <div class="actions">${u?`<button class="btn-install" onclick="updatePlugin('${p.id}')">🔄 Обновить</button>`:''}
        <button class="btn-details" onclick="showDetails('${p.id}')">📖 Подробнее</button>
        <button class="btn-delete" onclick="deletePlugin('${p.id}')">🗑️</button></div>
    </div>`
}
function filterPlugins(){
    const q=document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('#catalog-list .plugin').forEach(el=>{
        const n=el.querySelector('.name')?.textContent?.toLowerCase()||'';
        const d=el.querySelector('.desc')?.textContent?.toLowerCase()||'';
        el.style.display=n.includes(q)||d.includes(q)?'block':'none'
    })
}
function installPlugin(id){
    const p=STORE.plugins.find(x=>x.id===id);
    if(!p||STORE.installed.some(x=>x.id===id)){showToast('⚠️ Уже установлен');return}
    if(confirm(`Установить ${p.name} v${p.ver}?`)){
        STORE.installed.push({id:p.id,name:p.name,ver:p.ver,author:p.author,desc:p.desc,icon:p.icon||'🔌',installed:Date.now()});
        localStorage.setItem('store_installed',JSON.stringify(STORE.installed));
        renderAll();showToast('✅ Установлен!')
    }
}
function updatePlugin(id){
    const i=STORE.installed.find(x=>x.id===id),a=STORE.plugins.find(x=>x.id===id);
    if(!i||!a)return;
    if(confirm(`Обновить ${i.name}? v${i.ver} → v${a.ver}`)){
        i.ver=a.ver;
        localStorage.setItem('store_installed',JSON.stringify(STORE.installed));
        renderAll();showToast('✅ Обновлено!')
    }
}
function deletePlugin(id){
    if(confirm('Удалить плагин?')){
        STORE.installed=STORE.installed.filter(x=>x.id!==id);
        localStorage.setItem('store_installed',JSON.stringify(STORE.installed));
        renderAll();showToast('🗑️ Удалено')
    }
}
function showDetails(id){
    const p=STORE.plugins.find(x=>x.id===id)||STORE.installed.find(x=>x.id===id);
    if(!p)return;
    const inst=STORE.installed.some(x=>x.id===p.id);
    alert(`${p.name} v${p.ver}\n\n📝 ${p.desc}\n👤 ${p.author}\n⭐ ${p.rating||'Нет'}\n📥 ${p.downloads||0}${inst?'\n\n✅ Установлен':'\n\n❌ Не установлен'}`)
}
function uploadPlugin(){
    const n=document.getElementById('up-name').value.trim(),d=document.getElementById('up-desc').value.trim(),a=document.getElementById('up-author').value.trim(),v=document.getElementById('up-version').value.trim()||'1.0.0',f=document.getElementById('file-input').files[0];
    if(!n||!d||!a||!f){showToast('⚠️ Заполните всё и выберите файл');return}
    const np={id:'user_'+Date.now(),name:n,desc:d,author:a,ver:v,icon:'🔌',rating:0,downloads:0};
    STORE.plugins.push(np);
    STORE.installed.push({id:np.id,name:n,ver:v,author:a,desc:d,icon:'🔌',installed:Date.now()});
    localStorage.setItem('store_installed',JSON.stringify(STORE.installed));
    renderAll();showToast('✅ Загружено!');
    document.getElementById('up-name').value='';document.getElementById('up-desc').value='';document.getElementById('up-author').value='';document.getElementById('up-version').value='1.0.0';document.getElementById('file-input').value='';document.getElementById('file-name').textContent='Выберите файл';
    switchTab('installed')
}
function selectFile(){
    const i=document.getElementById('file-input'),l=document.getElementById('file-name');
    if(i.files&&i.files[0])l.textContent='📄 '+i.files[0].name
}
function switchTab(tab){
    document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(el=>el.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    document.querySelector(`.tabs button[data-tab="${tab}"]`).classList.add('active')
}
function showToast(t){
    let el=document.querySelector('.toast');
    if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}
    el.textContent=t;el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),2500)
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',function(){switchTab(this.dataset.tab)}));
loadData();
</script>
<div class="toast"></div>
</body>
</html>
