<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plugin Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;padding:16px}
.header{background:#1a1a1a;padding:16px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;color:#fff}
.badge{background:#4caf50;color:#fff;padding:2px 12px;border-radius:20px;font-size:11px}
.plugin{background:#1a1a1a;border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid #2196f3}
.plugin .top{display:flex;gap:12px;align-items:center}
.plugin .icon{font-size:24px}
.plugin .info{flex:1}
.plugin .name{font-weight:600;color:#fff;font-size:14px}
.plugin .desc{font-size:12px;color:#aaa;margin-top:2px}
.plugin .meta{font-size:11px;color:#666;display:flex;gap:12px;margin-top:4px}
.plugin .actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:opacity .2s;text-decoration:none;display:inline-block}
.btn:active{opacity:.7}
.btn-download{background:#1565c0;color:#fff}
.btn-upload{background:#4caf50;color:#fff}
.btn-web{background:0 0;color:#888;border:1px solid #444}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:0.3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.footer{text-align:center;padding:20px 0 10px;color:#444;font-size:11px;border-top:1px solid #2a2a2a;margin-top:16px}
</style>
</head>
<body>

<div class="header">
  <h1>🛒 Dolphy Store</h1>
  <span class="badge">v3.0</span>
</div>

<div id="catalog"></div>

<div class="footer">
  🔹 Нажми «Скачать» → откроется браузер для сохранения файла<br>
  🔹 Нажми «Загрузить свой» → откроется браузер для выбора файла
</div>

<div class="toast" id="toast"></div>

<script>
const PLUGINS = [
  {
    id: 'dolphyvpn',
    name: 'DolphyVPN',
    desc: 'HTTP/3 VPN tunnel with encryption',
    author: 'DCA',
    version: '2.5.0',
    icon: '🔒',
    color: '#00bcd4'
  },
  {
    id: 'secscan',
    name: 'Security Scanner',
    desc: 'Plugin security scanner with detailed report',
    author: 'gyrut',
    version: '3.2.0',
    icon: '🛡️',
    color: '#2196f3'
  },
  {
    id: 'dolphynews',
    name: 'Dolphy News',
    desc: 'News aggregator with RSS support',
    author: 'DCA',
    version: '2.3.0',
    icon: '📰',
    color: '#1565c0'
  },
  {
    id: 'dolphybrowser',
    name: 'Dolphy Browser',
    desc: 'Browser with tabs and bookmarks',
    author: 'DCA',
    version: '2.0.0',
    icon: '🌐',
    color: '#4caf50'
  },
  {
    id: 'dolphycode',
    name: 'Dolphy Code',
    desc: 'Code editor with syntax highlighting',
    author: 'DCA',
    version: '2.1.0',
    icon: '💻',
    color: '#007acc'
  }
];

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function downloadPlugin(id) {
  // Открываем страницу скачивания в браузере
  const url = window.location.origin + window.location.pathname.replace('index.html', '') + 'download.html?id=' + id;
  window.open(url, '_system');
  showToast('🌐 Открывается страница скачивания...');
}

function uploadPlugin() {
  // Открываем страницу загрузки в браузере
  const url = window.location.origin + window.location.pathname.replace('index.html', '') + 'upload.html';
  window.open(url, '_system');
  showToast('🌐 Открывается страница загрузки...');
}

function render() {
  const container = document.getElementById('catalog');
  container.innerHTML = PLUGINS.map(p => `
    <div class="plugin" style="border-left-color: ${p.color}">
      <div class="top">
        <div class="icon">${p.icon}</div>
        <div class="info">
          <div class="name">${p.name} <span style="font-weight:400;color:#666;font-size:11px">v${p.version}</span></div>
          <div class="desc">${p.desc} · ${p.author}</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-download" onclick="downloadPlugin('${p.id}')">📥 Скачать</button>
        <button class="btn btn-upload" onclick="uploadPlugin()">📤 Загрузить свой</button>
      </div>
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
