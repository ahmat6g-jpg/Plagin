<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Скачивание плагина — Dolphy Store</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #16181c;
      --card-border: #262930;
      --text-main: #f0f3f6;
      --text-muted: #8b949e;
      --accent-cyan: #00bcd4;
      --accent-green: #4caf50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .plugin-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .plugin-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .plugin-info {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .code-preview {
      background: #000;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      color: #a9b7c6;
      text-align: left;
      height: 120px;
      overflow-y: auto;
      margin-bottom: 20px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn-download {
      background: linear-gradient(135deg, #00bcd4, #1565c0);
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 188, 212, 0.3);
    }

    .btn-download:active {
      transform: scale(0.98);
    }

    .btn-close {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .status-msg {
      margin-top: 12px;
      font-size: 13px;
      color: var(--accent-green);
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="content-area">
      <div class="plugin-icon" id="icon">📦</div>
      <h1 class="plugin-title" id="name">Загрузка...</h1>
      <p class="plugin-info" id="meta">Пожалуйста, подождите</p>

      <div class="code-preview" id="code-preview">// Загрузка исходного кода...</div>

      <button class="action-btn btn-download" id="btn-save" onclick="executeDownload()">
        <span>💾</span> Скачать файл .js
      </button>
      <button class="action-btn btn-close" onclick="closeWindow()">
        Закрыть
      </button>

      <div class="status-msg" id="status-msg">
        ✅ Файл успешно сохранен! Импортируйте его в приложении Dolphy.
      </div>
    </div>
  </div>

  <script>
    // База данных кодов плагинов
    const PLUGIN_DATA = {
      'dolphyvpn': {
        name: 'DolphyVPN',
        version: '2.5.0',
        author: 'DCA',
        icon: '🔒',
        filename: 'dolphyvpn.js',
        code: `// @plugin id=dolphy.vpn name="DolphyVPN" version=2.5.0
function onLoad(api) {
  api.other.add({
    section: "main",
    title: "DolphyVPN",
    description: "HTTP/3 VPN tunnel",
    icon: "🔒",
    screen: "main",
    color: 0xFF00BCD4,
    order: 0
  });
  api.toast('✅ DolphyVPN loaded');
}
function screen_main(ui, api, state) {
  return ui.scaffold({
    topBar: { title: '🔒 DolphyVPN', showBack: true },
    content: ui.column({ padding: 16 }, [
      ui.text('DolphyVPN v2.5.0', { style: 'titleLarge', bold: true }),
      ui.spacer({ height: 8 }),
      ui.text('HTTP/3 VPN tunnel with encryption', { style: 'bodyMedium', color: 0xFF888888 }),
      ui.spacer({ height: 16 }),
      ui.text('👤 Author: DCA', { style: 'bodySmall', color: 0xFF666666 })
    ])
  });
}
function onUnload(api) {
  api.toast('DolphyVPN unloaded');
}`
      },
      'secscan': {
        name: 'Security Scanner',
        version: '3.2.0',
        author: 'gyrut',
        icon: '🛡️',
        filename: 'secscan.js',
        code: `// @plugin id=dolphy.secscan name="Security Scanner" version=3.2.0
function onLoad(api) {
  api.other.add({ section: "main", title: "Security Scanner", icon: "🛡️", screen: "main", color: 0xFF2196F3 });
  api.toast('🛡️ Security Scanner ready');
}
function screen_main(ui, api, state) {
  return ui.scaffold({
    topBar: { title: '🛡️ Security Scanner', showBack: true },
    content: ui.column({ padding: 16 }, [
      ui.text('Plugin Security Audit', { style: 'titleLarge' }),
      ui.spacer({ height: 12 }),
      ui.button('Start Deep Scan', { onClick: function() { api.toast('Scanning system...'); } })
    ])
  });
}`
      },
      'dolphynews': {
        name: 'Dolphy News',
        version: '2.3.0',
        author: 'DCA',
        icon: '📰',
        filename: 'dolphynews.js',
        code: `// @plugin id=dolphy.news name="Dolphy News" version=2.3.0
function onLoad(api) {
  api.other.add({ section: "main", title: "Dolphy News", icon: "📰", screen: "main", color: 0xFF1565C0 });
}
function screen_main(ui, api, state) {
  return ui.scaffold({
    topBar: { title: '📰 Dolphy News Hub', showBack: true },
    content: ui.column({ padding: 16 }, [
      ui.text('Latest Tech Updates', { style: 'titleMedium' })
    ])
  });
}`
      },
      'dolphybrowser': {
        name: 'Dolphy Browser',
        version: '2.0.0',
        author: 'DCA',
        icon: '🌐',
        filename: 'dolphybrowser.js',
        code: `// @plugin id=dolphy.browser name="Dolphy Browser" version=2.0.0
function onLoad(api) {
  api.other.add({ section: "main", title: "Dolphy Browser", icon: "🌐", screen: "main", color: 0xFF4CAF50 });
}
function screen_main(ui, api, state) {
  return ui.scaffold({
    topBar: { title: '🌐 Web Browser', showBack: true },
    content: ui.column({ padding: 16 }, [
      ui.text('Browser Tab Controller', { style: 'bodyLarge' })
    ])
  });
}`
      },
      'dolphycode': {
        name: 'Dolphy Code',
        version: '2.1.0',
        author: 'DCA',
        icon: '💻',
        filename: 'dolphycode.js',
        code: `// @plugin id=dolphy.code name="Dolphy Code" version=2.1.0
function onLoad(api) {
  api.other.add({ section: "main", title: "Dolphy Code", icon: "💻", screen: "main", color: 0xFF007ACC });
}
function screen_main(ui, api, state) {
  return ui.scaffold({
    topBar: { title: '💻 Code Editor', showBack: true },
    content: ui.column({ padding: 16 }, [
      ui.text('JavaScript IDE Environment', { style: 'bodyLarge' })
    ])
  });
}`
      }
    };

    let currentPlugin = null;

    // Инициализация при загрузке страницы
    function init() {
      const params = new URLSearchParams(window.location.search);
      const pluginId = params.get('id');

      if (pluginId && PLUGIN_DATA[pluginId]) {
        currentPlugin = PLUGIN_DATA[pluginId];
        document.getElementById('icon').innerText = currentPlugin.icon;
        document.getElementById('name').innerText = currentPlugin.name;
        document.getElementById('meta').innerText = `Версия ${currentPlugin.version} • Автор: ${currentPlugin.author}`;
        document.getElementById('code-preview').innerText = currentPlugin.code;
      } else {
        document.getElementById('name').innerText = 'Плагин не найден';
        document.getElementById('meta').innerText = 'Некорректный идентификатор запроса';
        document.getElementById('btn-save').style.display = 'none';
        document.getElementById('code-preview').innerText = '// Ошибка: Данные отсутствуют';
      }
    }

    // Скачивание файла без внешних библиотек
    function executeDownload() {
      if (!currentPlugin) return;

      const blob = new Blob([currentPlugin.code], { type: 'text/javascript;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);

      link.setAttribute('href', url);
      link.setAttribute('download', currentPlugin.filename);
      link.style.visibility = 'hidden';

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      document.getElementById('status-msg').style.display = 'block';
    }

    // Закрытие вкладки
    function closeWindow() {
      window.close();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
