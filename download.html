<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Загрузка плагина - Dolphy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #141414;
      border: 1px solid #222;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .icon-wrapper {
      width: 72px;
      height: 72px;
      background: #1a1a1a;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 16px;
      border: 1px solid #2a2a2a;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .version {
      font-size: 13px;
      color: #00bcd4;
      margin-bottom: 16px;
    }

    .author {
      font-size: 12px;
      color: #666;
      margin-bottom: 24px;
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #1565c0, #00bcd4);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(0, 188, 212, 0.25);
    }

    .close-btn {
      width: 100%;
      background: #1a1a1a;
      color: #888;
      border: 1px solid #2a2a2a;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .success-msg {
      display: none;
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid rgba(76, 175, 80, 0.3);
      color: #4caf50;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .error-msg {
      color: #f44336;
      font-size: 14px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <!-- Контент будет сгенерирован динамически -->
  </div>

  <script>
    // База данных кодов плагинов
    const PLUGIN_DATABASE = {
      'dolphyvpn': {
        name: 'DolphyVPN', version: '2.5.0', author: 'DCA', icon: '🔒',
        code: `// @plugin id=dolphy.vpn name="DolphyVPN" version=2.5.0
function onLoad(api) {
  api.other.add({
    section: "main",
    title: "DolphyVPN",
    description: "HTTP/3 VPN tunnel",
    icon: "🔒",
    screen: "main",
    color: 0xFF00BCD4,
    order: 0
  });
  api.toast('✅ DolphyVPN loaded');
}
function screen_main(ui, api, state) {
  return ui.scaffold({
    topBar: { title: '🔒 DolphyVPN', showBack: true },
    content: ui.column({ padding: 16 }, [
      ui.text('DolphyVPN v2.5.0', { style: 'titleLarge', bold: true }),
      ui.spacer({ height: 8 }),
      ui.text('HTTP/3 VPN tunnel with encryption', { style: 'bodyMedium', color: 0xFF888888 }),
      ui.spacer({ height: 16 }),
      ui.text('👤 Author: DCA', { style: 'bodySmall', color: 0xFF666666 })
    ])
  });
}
function onUnload(api) {
  api.toast('DolphyVPN unloaded');
}`
      },
      'secscan': {
        name: 'Security Scanner', version: '3.2.0', author: 'gyrut', icon: '🛡️',
        code: `// @plugin id=dolphy.secscan name="Security Scanner" version=3.2.0
function onLoad(api) {
  api.other.add({
    section: "main",
    title: "Security Scanner",
    description: "Plugin security scanner",
    icon: "🛡️",
    screen: "main",
    color: 0xFF2196F3,
    order: 1
  });
  api.toast('✅ Security Scanner loaded');
}
function screen_main(ui, api, state) {
  return ui.scaffold({
    topBar: { title: '🛡️ Security Scanner', showBack: true },
    content: ui.column({ padding: 16 }, [
      ui.text('Security Scanner v3.2.0', { style: 'titleLarge', bold: true }),
      ui.spacer({ height: 8 }),
      ui.text('Plugin security scanner with detailed report', { style: 'bodyMedium', color: 0xFF888888 }),
      ui.spacer({ height: 16 }),
      ui.text('👤 Author: gyrut', { style: 'bodySmall', color: 0xFF666666 })
    ])
  });
}
function onUnload(api) {
  api.toast('Security Scanner unloaded');
}`
      },
      'dolphynews': {
        name: 'Dolphy News', version: '2.3.0', author: 'DCA', icon: '📰',
        code: `// @plugin id=dolphy.news name="Dolphy News" version=2.3.0
function onLoad(api) {
  api.other.add({
    section: "main",
    title: "Dolphy News",
    description: "News aggregator with RSS",
    icon: "📰",
    screen: "main",
    color: 0xFF1565C0,
    order: 2
  });
  api.toast('✅ Dolphy News loaded');
}
function screen_main(ui, api, state) {
  return ui.scaffold({
    topBar: { title: '📰 Dolphy News', showBack: true },
    content: ui.column({ padding: 16 }, [
      ui.text('Dolphy News v2.3.0', { style: 'titleLarge', bold: true }),
      ui.spacer({ height: 8 }),
      ui.text('News aggregator with RSS support', { style: 'bodyMedium', color: 0xFF888888 }),
      ui.spacer({ height: 16 }),
      ui.text('👤 Author: DCA', { style: 'bodySmall', color: 0xFF666666 })
    ])
  });
}
function onUnload(api) {
  api.toast('Dolphy News unloaded');
}`
      },
      'dolphybrowser': {
        name: 'Dolphy Browser', version: '2.0.0', author: 'DCA', icon: '🌐',
        code: `// @plugin id=dolphy.browser name="Dolphy Browser" version=2.0.0
function onLoad(api) {
  api.other.add({
    section: "main",
    title: "Dolphy Browser",
    description: "Browser with tabs",
    icon: "🌐",
    screen: "main",
    color: 0xFF4CAF50,
    order: 3
  });
  api.toast('✅ Dolphy Browser loaded');
}
function screen_main(ui, api, state) {
  return ui.scaffold({
    topBar: { title: '🌐 Dolphy Browser', showBack: true },
    content: ui.column({ padding: 16 }, [
      ui.text('Dolphy Browser v2.0.0', { style: 'titleLarge', bold: true }),
      ui.spacer({ height: 8 }),
      ui.text('Browser with tabs and bookmarks', { style: 'bodyMedium', color: 0xFF888888 }),
      ui.spacer({ height: 16 }),
      ui.text('👤 Author: DCA', { style: 'bodySmall', color: 0xFF666666 })
    ])
  });
}
function onUnload(api) {
  api.toast('Dolphy Browser unloaded');
}`
      },
      'dolphycode': {
        name: 'Dolphy Code', version: '2.1.0', author: 'DCA', icon: '💻',
        code: `// @plugin id=dolphy.code name="Dolphy Code" version=2.1.0
function onLoad(api) {
  api.other.add({
    section: "main",
    title: "Dolphy Code",
    description: "Code editor with syntax highlighting",
    icon: "💻",
    screen: "main",
    color: 0xFF007ACC,
    order: 4
  });
  api.toast('✅ Dolphy Code loaded');
}
function screen_main(ui, api, state) {
  return ui.scaffold({
    topBar: { title: '💻 Dolphy Code', showBack: true },
    content: ui.column({ padding: 16 }, [
      ui.text('Dolphy Code v2.1.0', { style: 'titleLarge', bold: true }),
      ui.spacer({ height: 8 }),
      ui.text('Code editor with syntax highlighting', { style: 'bodyMedium', color: 0xFF888888 }),
      ui.spacer({ height: 16 }),
      ui.text('👤 Author: DCA', { style: 'bodySmall', color: 0xFF666666 })
    ])
  });
}
function onUnload(api) {
  api.toast('Dolphy Code unloaded');
}`
      }
    };

    // Чтение параметров URL
    const urlParams = new URLSearchParams(window.location.search);
    const pluginId = urlParams.get('id');
    const plugin = PLUGIN_DATABASE[pluginId];

    const appContainer = document.getElementById('app');

    if (!plugin) {
      appContainer.innerHTML = `
        <div class="error-msg">⚠️ Плагин не найден</div>
        <button class="close-btn" onclick="closeWindow()">Закрыть</button>
      `;
    } else {
      appContainer.innerHTML = `
        <div class="icon-wrapper">${plugin.icon}</div>
        <h1 class="title">${plugin.name}</h1>
        <div class="version">Версия ${plugin.version}</div>
        <div class="author">Автор: ${plugin.author}</div>
        <div id="success" class="success-msg">✅ Файл успешно сохранен!</div>
        <button class="action-btn" onclick="triggerDownload()">📥 Скачать .js файл</button>
        <button class="close-btn" onclick="closeWindow()">Закрыть</button>
      `;
    }

    // Инициализация загрузки через Blob и временную ссылку
    function triggerDownload() {
      if (!plugin) return;
      
      const blob = new Blob([plugin.code], { type: 'text/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      
      link.href = url;
      link.download = `${pluginId}.js`;
      document.body.appendChild(link);
      link.click();
      
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      document.getElementById('success').style.display = 'block';
    }

    // Безопасное закрытие окна/вкладки
    function closeWindow() {
      window.close();
      // Фолбэк на случай блокировки закрытия браузером
      setTimeout(() => {
        alert('Вы можете закрыть эту вкладку системного браузера вручную.');
      }, 300);
    }
  </script>
</body>
</html>
